<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 纸感主题色：与 --paper 一致，移动浏览器地址栏染色 -->
    <meta name="theme-color" content="#faf8f5" />
    <meta
      name="description"
      content="MediaLib 视觉资产库：可检索、可策展、可交付的图片与视频素材平台。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MediaLib" />
    <meta
      property="og:description"
      content="可检索、可策展、可交付的视觉资产库。"
    />
    <title>MediaLib</title>
    <!-- 首屏前先落主题：否则深色用户会先看到一帧浅色纸底再切换（FOUC） -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('medialib.theme') || 'auto'
          var dark =
            mode === 'dark' ||
            (mode === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          /* 隐私模式等存储不可用：保留默认浅色 */
        }
      })()
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23faf8f5'/><circle cx='16' cy='16' r='9' fill='none' stroke='%238c6a4a' stroke-width='2'/><path d='M16 7a9 9 0 0 0 0 18z' fill='%238c6a4a'/></svg>" />
    <script type="module" crossorigin src="/app/assets/index.DYRDs0XB.js"></script>
    <link rel="stylesheet" crossorigin href="/app/assets/index.CVpa4vdJ.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
