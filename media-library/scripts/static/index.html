<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MediaLib · 商业级媒体资产库</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="topbar">
    <div class="brand">
      <button class="icon-btn" id="btnSidebar" title="展开/收起侧边栏">☰</button>
      <div class="logo">MediaLib</div>
      <span class="stat-pill" id="stat">载入中…</span>
    </div>

    <div class="search-wrap">
      <span class="search-ico">⌕</span>
      <input id="q" class="search-input" type="search" placeholder="全库搜索标题、标签、来源、OCR文本…">
      <button class="clear-btn" id="btnClearQ" title="清空搜索" hidden>×</button>
    </div>

    <div class="toolbar-actions">
      <div class="seg" id="kindTabs">
        <button class="seg-btn on" data-k="">全部</button>
        <button class="seg-btn" data-k="image">图片</button>
        <button class="seg-btn" data-k="video">视频</button>
      </div>

      <select id="sortSelect" class="sel" title="排序方式">
        <option value="newest">最新入库</option>
        <option value="oldest">最早入库</option>
        <option value="pixels">最高像素</option>
        <option value="size">文件大小</option>
        <option value="views">最多浏览</option>
        <option value="random">随机漫步</option>
      </select>

      <div class="seg" id="viewTabs" title="视图模式">
        <button class="seg-btn on" data-v="masonry">瀑布流</button>
        <button class="seg-btn" data-v="grid">网格</button>
        <button class="seg-btn" data-v="list">列表</button>
      </div>

      <button class="btn primary" id="btnUpload">+ 上传</button>
      <button class="btn" id="btnIngestUrl">🔗 抓链接</button>
      <button class="btn" id="btnSelectMode">☑ 多选</button>
      <button class="icon-btn" id="btnJobs" title="任务中心">⚡<span class="dot" id="jobDot" hidden></span></button>
      <button class="icon-btn" id="btnTheme" title="切换明暗主题">◐</button>
      <a class="btn" href="/app/" title="打开前台沉浸浏览页">↗ 前台</a>
    </div>
  </header>

  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

  <div class="layout">
    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="nav-group">
        <div class="nav-item on" data-nav="all"><span>🖼 全部资产</span><b id="cntAll">0</b></div>
        <div class="nav-item" data-nav="trash"><span>🗑 回收站</span><b id="cntTrash">0</b></div>
        <div class="nav-item" data-nav="analytics"><span>📊 统计与存储</span></div>
      </div>

      <div class="side-section">
        <div class="side-head">
          <span>画板 / 专辑</span>
          <button class="mini-btn" id="btnNewCol">+ 新建</button>
        </div>
        <div class="col-list" id="colList"></div>
      </div>

      <div class="side-section">
        <div class="side-head">
          <span>高级筛选</span>
          <button class="mini-btn" id="btnResetFilters">重置</button>
        </div>
        <div class="filter-row">
          <select id="orientFilter" class="sel full">
            <option value="">全部方向</option>
            <option value="landscape">横图 / 横屏</option>
            <option value="portrait">竖图 / 竖屏</option>
            <option value="square">方形 (1:1)</option>
          </select>
        </div>
        <div class="filter-row">
          <select id="platformFilter" class="sel full">
            <option value="">全部来源平台</option>
          </select>
        </div>
        <div class="color-swatches" id="colorSwatches" title="按主色调筛选">
          <span class="swatch-label">主色调:</span>
          <button class="swatch" data-c="#e74c3c" style="background:#e74c3c"></button>
          <button class="swatch" data-c="#f39c12" style="background:#f39c12"></button>
          <button class="swatch" data-c="#2ecc71" style="background:#2ecc71"></button>
          <button class="swatch" data-c="#3498db" style="background:#3498db"></button>
          <button class="swatch" data-c="#9b59b6" style="background:#9b59b6"></button>
          <button class="swatch" data-c="#ecf0f1" style="background:#ecf0f1"></button>
          <button class="swatch" data-c="#1e222b" style="background:#1e222b"></button>
        </div>
      </div>

      <div class="side-section">
        <div class="side-head">
          <span>热门标签</span>
          <span class="hint">点击交集筛选</span>
        </div>
        <div class="tag-cloud" id="tagCloud"></div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main" id="mainArea">
      <div class="active-bar" id="activeBar" hidden></div>

      <!-- 媒体展示容器 -->
      <div class="gallery masonry" id="gallery"></div>
      <div class="done" id="done"></div>

      <!-- 数据看板视图 -->
      <section class="analytics-view" id="analyticsView" hidden>
        <div class="panel-grid">
          <div class="panel">
            <h3>存储空间分布</h3>
            <div id="storageBox">载入中…</div>
            <div class="panel-actions">
              <button class="btn" id="btnBackfill">↻ 回填存量元数据/缩略图</button>
              <button class="btn" id="btnRepair">🛠 一致性扫描修复</button>
            </div>
          </div>
          <div class="panel">
            <h3>近 30 天入库趋势</h3>
            <div id="dailyChart" class="bar-chart"></div>
          </div>
        </div>
        <div class="panel">
          <h3>热门浏览 Top 10</h3>
          <div id="topViewed" class="top-list"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 批量操作浮动栏 -->
  <div class="batch-bar" id="batchBar" hidden>
    <span>已选 <b id="batchCount">0</b> 项</span>
    <button class="btn" id="bAddTag">+ 打标签</button>
    <button class="btn" id="bRemTag">− 移除标签</button>
    <button class="btn" id="bAddCol">+ 加入画板</button>
    <button class="btn" id="bZip">⬇ 打包 ZIP</button>
    <button class="btn danger" id="bDelete">🗑 移入回收站</button>
    <button class="btn" id="bRestore" hidden>↩ 恢复</button>
    <button class="btn danger" id="bPurge" hidden>✕ 彻底删除</button>
    <button class="btn" id="bCancel">取消</button>
  </div>

  <!-- 专业媒体灯箱 -->
  <div class="lb" id="lb" hidden>
    <div class="lb-stage" id="lbStage">
      <button class="lb-close" id="lbClose">×</button>
      <button class="lb-nav prev" id="lbPrev">‹</button>
      <button class="lb-nav next" id="lbNext">›</button>
      <div class="lb-media-wrap" id="lbMediaWrap"></div>
      <div class="lb-controls" id="lbControls"></div>
    </div>
    <aside class="lb-drawer" id="lbDrawer">
      <div class="drawer-head">
        <span>资产详情</span>
        <button class="mini-btn" id="lbToggleDrawer">收起</button>
      </div>
      <div class="drawer-body" id="lbDrawerBody"></div>
    </aside>
  </div>

  <!-- URL 投递弹窗 -->
  <div class="modal" id="urlModal" hidden>
    <div class="modal-card">
      <h3>抓取链接入库</h3>
      <p class="muted">支持图片直链、网页、X/Twitter、B站、YouTube、Wallhaven 等</p>
      <input id="inUrl" class="inp" placeholder="https://...">
      <input id="inUrlTags" class="inp" placeholder="标签（逗号分隔，如：壁纸,人物）">
      <input id="inUrlTitle" class="inp" placeholder="自定义标题（可选）">
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('urlModal')">取消</button>
        <button class="btn primary" id="btnSubmitUrl">开始后台抓取</button>
      </div>
    </div>
  </div>

  <!-- 新建画板弹窗 -->
  <div class="modal" id="colModal" hidden>
    <div class="modal-card">
      <h3>新建画板</h3>
      <input id="inColName" class="inp" placeholder="画板名称（如：赛博朋克灵感）">
      <input id="inColDesc" class="inp" placeholder="描述（可选）">
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('colModal')">取消</button>
        <button class="btn primary" id="btnSubmitCol">创建</button>
      </div>
    </div>
  </div>

  <!-- 批量标签弹窗 -->
  <div class="modal" id="batchTagModal" hidden>
    <div class="modal-card">
      <h3 id="batchTagTitle">批量打标签</h3>
      <p class="muted" id="batchTagHint">输入标签（逗号或空格分隔），也可点选下方常用标签</p>
      <input id="inBatchTags" class="inp" placeholder="如：人物 壁纸">
      <div class="tag-cloud" id="batchTagPicks" style="margin-top:10px"></div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('batchTagModal')">取消</button>
        <button class="btn primary" id="btnSubmitBatchTag">确定</button>
      </div>
    </div>
  </div>

  <!-- 批量加入画板弹窗 -->
  <div class="modal" id="batchColModal" hidden>
    <div class="modal-card">
      <h3>加入画板</h3>
      <p class="muted">将已选资产批量归入目标画板</p>
      <select id="inBatchCol" class="sel full" style="margin-top:10px"></select>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('batchColModal')">取消</button>
        <button class="btn primary" id="btnSubmitBatchCol">确定</button>
      </div>
    </div>
  </div>

  <!-- 任务中心抽屉 -->
  <div class="jobs-drawer" id="jobsDrawer" hidden>
    <div class="drawer-head">
      <span>后台任务队列</span>
      <button class="mini-btn" id="btnCloseJobs">关闭</button>
    </div>
    <div class="jobs-list" id="jobsList"></div>
  </div>

  <!-- 全屏拖拽上传遮罩 -->
  <div class="drop-overlay" id="dropOverlay" hidden>
    <div class="drop-box">松开鼠标即可上传到媒体库</div>
  </div>

  <input type="file" id="filePicker" multiple accept="image/*,video/*" hidden>
  <div class="toast" id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
